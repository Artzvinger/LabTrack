services:
  postgres:
    image: postgres:16
    container_name: labtrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: labtrack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d labtrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./server
    container_name: labtrack-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/labtrack
      SESSION_SECRET: secret
      CLIENT_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: client
    container_name: labtrack-frontend
    restart: unless-stopped
    ports:
      - "5173:4173"
    depends_on:
      - backend

volumes:
  postgres_data:
